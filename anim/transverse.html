<!DOCTYPE html>
<html lang="ja">
<head>

<style>
/* Layout: one-column worksheet on graph paper (same identity as the Web test) — sticky scene tabs, a wide canvas stage, controls under it, "見てみよう" questions below. */
:root{
  --paper:#FAFBF7; --grid:#E4EBF1; --ink:#1C2430; --muted:#5B6675;
  --blue:#2447B3; --blue-soft:#E7EDFB; --red:#CF2A2A; --red-soft:#FCECEA;
  --line:#CBD5DF; --sheet:#FFFFFF; --btn:#2447B3; --shade:#EEF2F6;
  --body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --pen:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",cursive;
  --math:"Times New Roman",Times,"Noto Serif",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121821; --grid:#1B2430; --ink:#E4E9F0; --muted:#9AA6B5;
    --blue:#93AAFF; --blue-soft:#1F2B4B; --red:#FF7A70; --red-soft:#3A2022;
    --line:#2F3B49; --sheet:#18202B; --btn:#3A5BD0; --shade:#202A37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121821; --grid:#1B2430; --ink:#E4E9F0; --muted:#9AA6B5;
  --blue:#93AAFF; --blue-soft:#1F2B4B; --red:#FF7A70; --red-soft:#3A2022;
  --line:#2F3B49; --sheet:#18202B; --btn:#3A5BD0; --shade:#202A37; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.75;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-text-size-adjust:100%;
}
button,select{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.qv{font-family:var(--math);font-style:italic;font-size:1.08em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:760px;margin:0 auto;padding:10px 16px 0}
.back{font-size:14px;color:var(--blue);text-decoration:none}
.nav{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin:2px 0 6px}
.nav a{color:var(--blue);text-decoration:none}
.nav a[aria-current="page"]{color:var(--ink);font-weight:700}
h1{font-size:19px;margin:2px 0 0;line-height:1.4;text-wrap:balance}
.tabs{display:flex;gap:4px;padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:0;line-height:1.35;text-align:center;border:0;background:none;padding:8px 4px 10px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}

main{max-width:760px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:18px 16px;min-width:0}
h2{font-size:20px;margin:0 0 4px;line-height:1.4;text-wrap:balance}
.lead{margin:0 0 12px;color:var(--muted);font-size:15px}
.stage{position:relative;width:100%;aspect-ratio:2/1;max-width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:4px;touch-action:manipulation}
@media (max-width:520px){.stage{aspect-ratio:4/3}}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.clock{position:absolute;left:10px;top:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legend li{display:block}
sub{font-size:.7em;line-height:0}
.legend svg{margin-right:6px;vertical-align:middle}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{border:0;border-radius:8px;padding:9px 16px;min-height:44px;font-weight:700;cursor:pointer;background:var(--btn);color:#fff}
.btn.ghost{background:none;color:var(--blue);border:1.5px solid var(--blue)}
.speed{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-left:auto}
.speed select{min-height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);padding:4px 8px}

.opts{display:grid;gap:10px;margin-top:14px}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seg-label{font-size:14px;color:var(--muted);min-width:5.5em}
.seg button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:4px 18px}
.checks label{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:15px}
.checks input{width:20px;height:20px;accent-color:var(--blue)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

h3{font-size:17px;margin:0 0 8px}
.qs{margin:0;padding-left:1.4em;display:grid;gap:10px}
.qs li{padding-left:2px}
.qs details{margin-top:4px}
.qs summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:14px;padding:4px 0}
.ans{margin:4px 0 0;padding:8px 12px;background:var(--blue-soft);border-radius:6px;font-size:15px}
.note{font-family:var(--pen);color:var(--red);font-size:17px;margin:0 0 6px}
/* 配置：スマホは1列。PC（幅 1000px 以上）は左に図と再生ボタン（固定）、右に説明・設定・見てみよう */
.board{display:flex;flex-direction:column}
.colG,.colC,.head{display:contents}
.qbox{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
@media (min-width:1000px){
  .top-inner,main{max-width:1360px}
  .board{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);column-gap:22px;align-items:start}
  .head,.colC{display:block;grid-column:2}
  .head{grid-row:1}.colC{grid-row:2}
  .colG{display:block;grid-column:1;grid-row:1 / span 2;position:sticky;top:calc(var(--hdr,130px) + 10px)}
  .colG .stage{aspect-ratio:auto;height:max(300px,calc(100vh - var(--hdr,130px) - 170px))}
  .head .lead{font-size:14px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="back" id="backLink" href="../index.html#/u/waves/1" hidden>‹ 波の性質（演習）へ</a>
    <h1>横波のアニメーション</h1>
    <nav class="nav" id="nav" hidden aria-label="アニメーション">
      <a href="index.html">≡ アニメーション集</a>
      <a href="wave-model.html">横波の模型</a>
      <a href="wave-model-l.html">縦波の模型</a>

</header>

<main>
  <section class="sheet board" aria-labelledby="sceneTitle">
    <div class="head"><h2 id="sceneTitle"></h2>
    <p class="lead" id="sceneLead"></p></div>
    <div class="colG"><div class="stage">
      <canvas id="cv" role="img" aria-label=""></canvas>
      <div class="clock" id="clock" aria-live="off"></div>
    </div>
    <ul class="legend" id="legend"></ul>
    <div class="controls">
      <button type="button" class="btn" id="playBtn">一時停止</button>
      <button type="button" class="btn ghost" id="stepBtn">コマ送り</button>
      <button type="button" class="btn ghost" id="resetBtn">最初から</button>
      <label class="speed" for="speedSel">速さ
        <select id="speedSel">
          <option value="0.25">ゆっくり</option>
          <option value="0.5" selected>ふつう</option>
          <option value="1">はやい</option>
        </select>
      </label>
    </div></div>
    <div class="colC">
    <div class="opts" id="opts"></div>
    <p class="hint">図をタップすると、その位置の媒質の点を赤い点で追いかけます。点は上下に動くだけで、波と一緒に横へは進みません。</p>
    <div class="qbox" aria-labelledby="qsTitle">
    <h3 id="qsTitle">見てみよう</h3>
    <ol class="qs" id="qs"></ol>
    </div>
    </div>
  </section>
</main>

<script>
(function(){
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const I = s => `<i class="qv">${s}</i>`;

/* ---------- physics ---------- */
// 合成：半波長の正弦形パルス（幅 w）を2つ、逆向きに進める
function pulse(u, w){ return (u >= 0 && u <= w) ? Math.sin(Math.PI * u / w) : 0; }
const SUP = { w:2, v:2, len:12, period:6 };            // 位置の単位はマス、速さはマス/s
const TAU = 2 * Math.PI;

const SCENES = {
  sup: {
    title:"波の重ね合わせ",
    lead:`2つのパルスが向かい合って進み、重なり、すれ違います。重なった点の変位は、それぞれの波の変位の和（${I("y")} ＝ ${I("y")}<sub>1</sub> ＋ ${I("y")}<sub>2</sub>）になります。`,
    xmin:0, xmax:12, ymax:2.4, step:0.125, loop:6.0,
    opts:[
      {type:"seg", key:"combo", label:"組み合わせ", items:[["hh","山と山"],["ht","山と谷"],["hs","大きさの違う山"]]},
      {type:"check", key:"parts", label:"それぞれの波（成分）"},
      {type:"check", key:"dots", label:"媒質の点"}
    ],
    legend:[["blue","dash",`右へ進む波 ${I("y")}<sub>1</sub>`],["red","dash",`左へ進む波 ${I("y")}<sub>2</sub>`],["ink","solid",`重なった結果 ${I("y")}`]],
    qs:[
      ["「山と山」で2つの山がぴったり重なった瞬間、変位は1つの山の何倍になるか。","2倍。重なった点の変位はそれぞれの変位の和だからです。"],
      ["「山と谷」でぴったり重なった瞬間、媒質は一瞬まっすぐになる。このとき波は消えてしまったか。","消えていません。変位の和が0になっただけで、それぞれの波はそのまま進み、すれ違った後にもとの形で現れます。"],
      ["すれ違った後、それぞれの波の形や速さは変わったか。","変わりません。重なっても互いに影響を残さない（波の独立性）。"]
    ]
  },
  std: {
    title:"定在波（定常波）",
    lead:"同じ波長・同じ振幅の波が、互いに逆向きに進んで重なると、どちらにも進まない定在波（定常波）ができます。",
    xmin:0, xmax:2, ymax:2.4, step:1/8, loop:null,
    opts:[
      {type:"check", key:"parts", label:"それぞれの波（成分）"},
      {type:"check", key:"env", label:"振動の範囲（包絡線）"},
      {type:"check", key:"marks", label:"節と腹"},
      {type:"check", key:"dots", label:"媒質の点"}
    ],
    legend:[["blue","dash","右へ進む波"],["red","dash","左へ進む波"],["ink","solid","定在波（定常波）：重なった結果"]],
    qs:[
      ["まったく振動しない点（節）はどこにあるか。隣り合う節の間隔は波長の何倍か。",`節は「節と腹」で▲を付けた点です。隣り合う節の間隔は ${I("λ")}/2（半波長）です。`],
      ["腹の振幅は、もとの波の振幅の何倍か。","2倍。2つの波の山どうしが重なる位置が腹になります。"],
      ["「媒質の点」を表示して、節をはさんだ両側の腹の動きを比べよう。","節をはさんだ両側の腹は、いつも逆向きに動きます（一方が山のとき、他方は谷）。"],
      ["「成分」を消して定在波（定常波）だけを見よう。波形は右や左に進んでいるか。","進んでいません。節の位置は動かず、その場で振動をくり返します。"]
    ]
  },
  ref: {
    title:"反射と定在波（定常波）",
    lead:"右の端で波が反射します。固定端では山が谷になって、自由端では山のまま反射します。連続した波では、入射波と反射波が重なって定在波（定常波）ができます。",
    xmin:0, xmax:3, Lb:2, ymax:2.4, step:1/8, loop:null,
    opts:[
      {type:"seg", key:"wave", label:"入射する波", items:[["pulse","パルス（山1つ）"],["cont","連続した波"]]},
      {type:"seg", key:"end", label:"右の端", items:[["fixed","固定端"],["free","自由端"]]},
      {type:"check", key:"parts", label:"入射波と反射波"},
      {type:"check", key:"build", label:"反射波の作図（端の向こう側）"},
      {type:"check", key:"dots", label:"媒質の点"}
    ],
    legend:[["blue","dash","入射波"],["red","dash","反射波"],["ink","solid","媒質の実際の形（重なった結果）"]],
    qs:[
      ["パルスを固定端・自由端で反射させよう。山はそれぞれどのように戻ってくるか。","固定端では谷になって（上下が逆になって）、自由端では山のまま戻ってきます。"],
      ["「反射波の作図」を表示しよう。固定端で反射波を描く手順を言葉で説明せよ。","① 入射波を端の向こう側まで延長する（青の点線）。② 固定端では上下を反転する（赤の点線）。③ それを端で折り返すと反射波になる。自由端では②を省きます。"],
      ["連続した波で、十分に時間がたつとどうなるか。端の点は節か、腹か。","入射波と反射波が重なって定在波（定常波）になります。固定端は動けないので節、自由端は大きく動くので腹になります。"],
      ["固定端のとき、端から最も近い腹はどこにあるか。",`端から ${I("λ")}/4 の位置です。節と節の間隔は ${I("λ")}/2、節から腹までは ${I("λ")}/4 です。`]
    ]
  }
};

/* ---------- state ---------- */
const state = {
  scene:"sup", t:0, playing:true, speed:0.5, track:null,
  sup:{combo:"hh", parts:true, dots:false},
  std:{parts:true, env:false, marks:true, dots:false},
  ref:{wave:"pulse", end:"fixed", parts:true, build:false, dots:false}
};
try{ const s = localStorage.getItem("transverse-scene"); if(s && SCENES[s]) state.scene = s; }catch(e){}
if(location.hash && SCENES[location.hash.slice(1)]) state.scene = location.hash.slice(1);
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce) state.playing = false;
if(/\/anim\//.test(location.pathname)){ $("backLink").hidden = false; $("nav").hidden = false; }

/* ---------- displacement functions ---------- */
function supParts(x, t){
  const o = state.sup, w = SUP.w, v = SUP.v;
  const a1 = 1, a2 = o.combo === "ht" ? -1 : (o.combo === "hs" ? 0.55 : 1);
  const y1 = a1 * pulse(x - (0.5 + v * t), w);          // 左端 0.5 から右へ
  const y2 = a2 * pulse((11.5 - v * t) - x, w);         // 右端 11.5 から左へ
  return [y1, y2];
}
function stdParts(x, t){ return [Math.sin(TAU * (t - x)), Math.sin(TAU * (t + x))]; }   // λ ＝ 1, T ＝ 1, A ＝ 1
function incident(x, t){
  const o = state.ref;
  if(o.wave === "pulse"){ return pulse(t - x, 0.5); }              // 先頭が x ＝ t、幅 λ/2
  return (x <= t) ? Math.sin(TAU * (t - x)) : 0;                    // 連続波（先頭から振動が始まる）
}
function refParts(x, t){
  const Lb = SCENES.ref.Lb, s = state.ref.end === "fixed" ? -1 : 1;
  return [incident(x, t), s * incident(2 * Lb - x, t)];
}

/* ---------- drawing ---------- */
let W = 0, H = 0, dpr = 1, col = {};
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  ["ink","muted","blue","red","line","sheet","grid","shade","blue-soft","red-soft"].forEach(k => col[k] = cs.getPropertyValue("--" + k).trim());
}
function resize(){ const tp = document.querySelector(".top"); if(tp) document.documentElement.style.setProperty("--hdr", tp.offsetHeight + "px");
  const r = cv.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
}
function frame(sc){
  const padL = 18, padR = 18, padT = 26, padB = 34;
  const X = x => padL + (x - sc.xmin) / (sc.xmax - sc.xmin) * (W - padL - padR);
  const Y = y => padT + (H - padT - padB) / 2 - y / sc.ymax * (H - padT - padB) / 2;
  const Xinv = px => sc.xmin + (px - padL) / (W - padL - padR) * (sc.xmax - sc.xmin);
  return {X, Y, Xinv, padL, padR, padT, padB};
}
function line(pts, color, width, dash){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
}
function curve(f, x0, x1, F, n){
  const pts = []; n = n || 360;
  for(let i = 0; i <= n; i++){ const x = x0 + (x1 - x0) * i / n; pts.push([F.X(x), F.Y(f(x))]); }
  return pts;
}
/* 図の中の文字：*…* で囲んだ部分を物理量（斜体）で描く。_x・_{in} は下付き。単位・数字は立体のまま */
function RT(c, s, x, y, color, size, align, bold, fam, base){
  size = size || 12; s = String(s); const seg = []; let it = false;
  for(let i = 0; i < s.length; i++){
    const ch = s[i];
    if(ch === "*"){ it = !it; continue; }
    if((ch === "_" || ch === "^") && i + 1 < s.length){
      let t = s[i + 1]; if(t === "{"){ const j = s.indexOf("}", i + 2); t = s.slice(i + 2, j); i = j; } else i++;
      seg.push({ t, it: ch === "_" ? /^[xyz]$/.test(t) : /^[a-zA-Z]$/.test(t), k: ch === "_" ? 1 : -1 }); continue;
    }
    const L = seg[seg.length - 1]; if(L && !L.k && L.it === it) L.t += ch; else seg.push({ t: ch, it, k: 0 });
  }
  const ff = fam || 'BIZ UDPGothic,"Hiragino Sans","Yu Gothic UI",sans-serif';
  const font = o => { const z = o.k ? size * .72 : o.it ? size * 1.12 : size; return o.it ? `italic ${bold ? "700 " : ""}${z.toFixed(1)}px "Times New Roman",Times,serif` : `${bold ? "700 " : ""}${z.toFixed(1)}px ${ff}`; };
  c.save(); c.fillStyle = color; c.textBaseline = base || "middle"; let w = 0;
  seg.forEach(o => { c.font = font(o); o.w = c.measureText(o.t).width + (o.it && !o.k ? size * .04 : 0); w += o.w; });
  let x0 = align === "right" ? x - w : align === "center" ? x - w / 2 : x; c.textAlign = "left";
  seg.forEach(o => { c.font = font(o); c.fillText(o.t, x0, y + (o.k === 1 ? size * .3 : o.k === -1 ? -size * .4 : 0)); x0 += o.w; }); c.restore(); return w;
}
function text(s, x, y, color, size, align, font, italic){ if(String(s).includes("*")) return RT(ctx, s, x, y, color, size, align || "center");
  ctx.save(); ctx.fillStyle = color; ctx.font = `${italic ? "italic " : ""}${size || 12}px ${font || 'BIZ UDPGothic, "Hiragino Sans", "Yu Gothic UI", sans-serif'}`;
  ctx.textAlign = align || "center"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); ctx.restore();
}
function axis(sc, F, x1){
  line([[F.X(sc.xmin), F.Y(0)], [F.X(x1 ?? sc.xmax), F.Y(0)]], col.line, 1.2);
}
function lambdaTicks(sc, F, upto){
  const labels = {0.5:"*λ*/2", 1:"*λ*", 1.5:"3*λ*/2", 2:"2*λ*", 2.5:"5*λ*/2"};
  for(let k = 0.5; k <= upto + 1e-9; k += 0.5){
    ctx.save(); ctx.strokeStyle = col.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(F.X(k), H - F.padB + 4); ctx.lineTo(F.X(k), H - F.padB + 10); ctx.stroke(); ctx.restore();
    text(labels[k] || "", F.X(k), H - F.padB + 22, col.muted, 13, "center", '"Times New Roman", Times, serif', true);
  }
}
function dots(f, xs, F){
  ctx.save(); ctx.fillStyle = col.ink; ctx.globalAlpha = .55;
  xs.forEach(x => { ctx.beginPath(); ctx.arc(F.X(x), F.Y(f(x)), 3, 0, TAU); ctx.fill(); });
  ctx.restore();
}
function tracked(f, F, sc, xlimit){
  if(state.track == null) return;
  const x = state.track; if(x < sc.xmin || x > (xlimit ?? sc.xmax)) return;
  line([[F.X(x), F.Y(sc.ymax * .92)], [F.X(x), F.Y(-sc.ymax * .92)]], col.red, 1, [3, 4]);
  ctx.save(); ctx.fillStyle = col.red; ctx.beginPath(); ctx.arc(F.X(x), F.Y(f(x)), 6, 0, TAU); ctx.fill(); ctx.restore();
}
function fmtT(t){
  const k = Math.round(t * 8);
  if(Math.abs(t * 8 - k) < 1e-6){
    if(k === 0) return "0";
    let n = k, d = 8; const g = (a, b) => b ? g(b, a % b) : a; const c = g(n, d); n /= c; d /= c;
    const T = '<i class="qv">T</i>'; return d === 1 ? (n === 1 ? T : `${n}${T}`) : `${n === 1 ? "" : n}${T}/${d}`;
  }
  return `${t.toFixed(2)}<i class="qv">T</i>`;
}

function draw(){
  if(!W) return;
  readColors();
  ctx.clearRect(0, 0, W, H);
  const sc = SCENES[state.scene], F = frame(sc), t = state.t;

  if(state.scene === "sup"){
    const o = state.sup;
    // 1マスごとのごく薄い目盛り
    for(let k = 1; k < sc.xmax; k++) line([[F.X(k), F.Y(sc.ymax)], [F.X(k), F.Y(-sc.ymax)]], col.grid, 1);
    axis(sc, F);
    const f1 = x => supParts(x, t)[0], f2 = x => supParts(x, t)[1], fs = x => f1(x) + f2(x);
    if(o.parts){ line(curve(f1, 0, 12, F), col.blue, 2, [7, 5]); line(curve(f2, 0, 12, F), col.red, 2, [7, 5]); }
    line(curve(fs, 0, 12, F, 480), col.ink, 3.2);
    if(o.dots) dots(fs, Array.from({length:49}, (_, i) => i * 0.25), F);
    tracked(fs, F, sc);
    $("clock").innerHTML = `<i class="qv">t</i> ＝ ${t.toFixed(2)} s`;
  }

  if(state.scene === "std"){
    const o = state.std;
    axis(sc, F); lambdaTicks(sc, F, 2);
    const f1 = x => stdParts(x, t)[0], f2 = x => stdParts(x, t)[1], fs = x => f1(x) + f2(x);
    if(o.env){ const e = x => 2 * Math.abs(Math.cos(TAU * x)); line(curve(e, 0, 2, F), col.muted, 1.2, [2, 4]); line(curve(x => -e(x), 0, 2, F), col.muted, 1.2, [2, 4]); }
    if(o.parts){ line(curve(f1, 0, 2, F), col.blue, 2, [7, 5]); line(curve(f2, 0, 2, F), col.red, 2, [7, 5]); }
    line(curve(fs, 0, 2, F), col.ink, 3.2);
    if(o.marks){
      [0.25, 0.75, 1.25, 1.75].forEach(x => { marker(F.X(x), F.Y(0), col.red); text("節", F.X(x), F.Y(0) + 18, col.red, 12); });
      [0, 0.5, 1, 1.5, 2].forEach(x => text("腹", F.X(x) + (x === 0 ? 10 : x === 2 ? -10 : 0), F.Y(2.25), col.blue, 12));
    }
    if(o.dots) dots(fs, Array.from({length:33}, (_, i) => i / 16), F);
    tracked(fs, F, sc);
    $("clock").innerHTML = `<i class="qv">t</i> ＝ ${fmtT(t)}`;
  }

  if(state.scene === "ref"){
    const o = state.ref, Lb = sc.Lb;
    const fi = x => refParts(x, t)[0], fr = x => refParts(x, t)[1], fs = x => fi(x) + fr(x);
    // 端の向こう側（作図用の領域）
    ctx.save(); ctx.fillStyle = col.shade; ctx.fillRect(F.X(Lb), F.padT - 10, F.X(sc.xmax) - F.X(Lb) + F.padR, H - F.padT - F.padB + 20); ctx.restore();
    text(o.build ? "端の向こう側（作図用）" : "", (F.X(Lb) + F.X(sc.xmax)) / 2, H - F.padB + 22, col.muted, 11);
    axis(sc, F, Lb); lambdaTicks(sc, F, 1.5);
    if(o.build){
      const ext = x => incident(x, t);
      line(curve(ext, Lb, sc.xmax, F, 120), col.blue, 1.6, [2, 4]);
      if(o.end === "fixed") line(curve(x => -ext(x), Lb, sc.xmax, F, 120), col.red, 1.6, [2, 4]);
    }
    if(o.parts){ line(curve(fi, 0, Lb, F), col.blue, 2, [7, 5]); line(curve(fr, 0, Lb, F), col.red, 2, [7, 5]); }
    line(curve(fs, 0, Lb, F), col.ink, 3.2);
    // 端の描画
    if(o.end === "fixed"){
      line([[F.X(Lb), F.Y(2.2)], [F.X(Lb), F.Y(-2.2)]], col.ink, 4);
      for(let k = -2; k <= 2; k += 0.4) line([[F.X(Lb) + 1, F.Y(k)], [F.X(Lb) + 10, F.Y(k + 0.3)]], col.muted, 1.2);
      text("固定端", F.X(Lb), 12, col.ink, 12);
    } else {
      line([[F.X(Lb), F.Y(2.2)], [F.X(Lb), F.Y(-2.2)]], col.muted, 2);
      ctx.save(); ctx.strokeStyle = col.ink; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.ellipse(F.X(Lb), F.Y(fs(Lb)), 6, 9, 0, 0, TAU); ctx.stroke(); ctx.restore();
      text("自由端", F.X(Lb), 12, col.ink, 12);
    }
    // 連続波で定在波（定常波）ができあがったら、節と腹を示す
    if(o.wave === "cont" && t >= 2 * Lb){
      const nodes = o.end === "fixed" ? [2, 1.5, 1, 0.5, 0] : [1.75, 1.25, 0.75, 0.25];
      nodes.forEach(x => { marker(F.X(x), F.Y(0), col.red); text("節", F.X(x) + (x === 2 ? -12 : 0), F.Y(0) + 18, col.red, 12); });
      if(o.end === "free") text("腹", F.X(Lb) - 12, F.Y(2.25), col.blue, 12);
    }
    if(o.dots) dots(fs, Array.from({length:33}, (_, i) => i / 16), F);
    tracked(fs, F, sc, Lb);
    $("clock").innerHTML = `<i class="qv">t</i> ＝ ${fmtT(t)}`;
  }
}
function marker(x, y, color){
  ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x - 5, y + 2); ctx.lineTo(x + 5, y + 2); ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ---------- UI ---------- */
function swatch(c, style){
  const color = `var(--${c})`, dash = style === "dash" ? 'stroke-dasharray="6 4"' : "";
  return `<svg width="28" height="10" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" stroke="${color}" stroke-width="${style === "dash" ? 2 : 3.2}" ${dash} stroke-linecap="round"/></svg>`;
}
function renderScene(){
  const sc = SCENES[state.scene], o = state[state.scene];
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.scene === state.scene));
  $("sceneTitle").textContent = sc.title;
  $("sceneLead").innerHTML = sc.lead;
  $("legend").innerHTML = sc.legend.map(([c, s, l]) => `<li>${swatch(c, s)}${l}</li>`).join("");
  $("qs").innerHTML = sc.qs.map(([q, a]) => `<li>${q}<details><summary>答えを見る</summary><p class="ans">${a}</p></details></li>`).join("");
  $("opts").innerHTML = sc.opts.map(op => {
    if(op.type === "seg") return `<div class="seg" role="group" aria-label="${op.label}"><span class="seg-label">${op.label}</span>${op.items.map(([v, l]) => `<button type="button" data-key="${op.key}" data-val="${v}" aria-pressed="${o[op.key] === v}">${l}</button>`).join("")}</div>`;
    return "";
  }).join("") + `<div class="checks">${sc.opts.filter(op => op.type === "check").map(op => `<label for="ck-${state.scene}-${op.key}"><input type="checkbox" id="ck-${state.scene}-${op.key}" data-key="${op.key}" ${o[op.key] ? "checked" : ""}>${op.label}</label>`).join("")}</div>`;
  cv.setAttribute("aria-label", `${sc.title}のアニメーション。${sc.lead.replace(/<[^>]+>/g, "")}`);
  draw();
}
function setPlaying(p){ state.playing = p; $("playBtn").textContent = p ? "一時停止" : "再生"; }

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  state.scene = b.dataset.scene; state.t = 0; state.track = null;
  try{ localStorage.setItem("transverse-scene", state.scene); }catch(e){}
  renderScene();
}));
$("opts").addEventListener("click", e => {
  const b = e.target.closest("button[data-key]"); if(!b) return;
  state[state.scene][b.dataset.key] = b.dataset.val;
  if(state.scene === "ref") state.t = 0;   // 条件を変えたら最初から
  renderScene();
});
$("opts").addEventListener("change", e => {
  const c = e.target.closest("input[data-key]"); if(!c) return;
  state[state.scene][c.dataset.key] = c.checked; draw();
});
$("playBtn").addEventListener("click", () => setPlaying(!state.playing));
$("stepBtn").addEventListener("click", () => {
  setPlaying(false);
  const st = SCENES[state.scene].step;
  state.t = Math.round((state.t + st) / st) * st; wrap(); draw();
});
$("resetBtn").addEventListener("click", () => { state.t = 0; draw(); });
$("speedSel").addEventListener("change", e => { state.speed = parseFloat(e.target.value); });
cv.addEventListener("pointerdown", e => {
  const sc = SCENES[state.scene], F = frame(sc), r = cv.getBoundingClientRect();
  let x = F.Xinv(e.clientX - r.left);
  const step = state.scene === "sup" ? 0.25 : 1 / 16, lim = state.scene === "ref" ? sc.Lb : sc.xmax;
  x = Math.round(x / step) * step;
  state.track = (x < sc.xmin || x > lim) ? null : x; draw();
});
function wrap(){
  const sc = SCENES[state.scene];
  if(state.scene === "sup" && state.t > sc.loop) state.t = 0;
  if(state.scene === "ref" && state.ref.wave === "pulse" && state.t > 2 * sc.Lb + 1.2) state.t = 0;
}
let last = null;
function tick(ts){
  if(last == null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if(state.playing){ state.t += dt * state.speed; wrap(); draw(); }
  requestAnimationFrame(tick);
}
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
if(mq && mq.addEventListener) mq.addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
if(window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener("resize", resize);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

setPlaying(state.playing);
renderScene(); resize();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
